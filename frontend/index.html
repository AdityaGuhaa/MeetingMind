<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeetingMind</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f1117;
    --surface:  #1a1d27;
    --surface2: #22263a;
    --border:   #2e334d;
    --text:     #e2e4f0;
    --muted:    #7b80a0;
    --accent:   #6c72f5;
    --accent2:  #4ecdc4;
    --live:     #f45c5c;
    --green:    #56c79a;
    --radius:   10px;
    --mono:     'Fira Code', 'Consolas', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Layout ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .logo span { color: var(--accent); }

  .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
    background: var(--surface2); border: 1px solid var(--border);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
  }
  .dot.live { background: var(--live); animation: pulse 1.4s ease infinite; }
  .dot.ready { background: var(--green); }
  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.35; }
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 57px);
  }

  /* ── Controls bar ── */
  .controls {
    grid-column: 1 / -1;
    display: flex; gap: 10px; align-items: center;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  input[type=text] {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--radius);
    padding: 7px 12px; font-size: 13px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--muted); }

  button {
    padding: 7px 16px; border-radius: var(--radius);
    border: none; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: default; }
  .btn-start  { background: var(--green);  color: #0a1f15; }
  .btn-stop   { background: var(--live);   color: #fff; }
  .btn-action { background: var(--accent); color: #fff; }
  .btn-ghost  {
    background: transparent; border: 1px solid var(--border);
    color: var(--text);
  }

  /* ── Transcript panel ── */
  .transcript-panel {
    overflow-y: auto;
    padding: 20px 24px;
    background: var(--bg);
  }

  .segment-group { margin-bottom: 16px; }
  .speaker-label {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--accent); margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .speaker-label .ts { color: var(--muted); font-weight: 400; font-family: var(--mono); }
  .segment-text {
    background: var(--surface); border-left: 3px solid var(--border);
    padding: 8px 14px; border-radius: 0 var(--radius) var(--radius) 0;
    color: var(--text); line-height: 1.65;
  }
  .segment-text.new {
    border-left-color: var(--accent);
    animation: fadeIn .4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }

  /* Speaker color rotation */
  .spk-0 { color: #6c72f5; }
  .spk-1 { color: #4ecdc4; }
  .spk-2 { color: #f7b731; }
  .spk-3 { color: #f45c5c; }
  .spk-4 { color: #a29bfe; }
  .spk-5 { color: #fd79a8; }

  /* ── Right sidebar ── */
  .sidebar {
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--surface);
  }

  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 10px 6px; text-align: center;
    font-size: 12px; font-weight: 600;
    color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .tab-panel { display: none; flex: 1; overflow-y: auto; padding: 16px; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 12px; }

  /* Summary */
  .summary-box {
    background: var(--surface2); border-radius: var(--radius);
    padding: 12px; font-size: 13px; line-height: 1.7;
    color: var(--text); white-space: pre-wrap;
    min-height: 80px;
  }
  .summary-box.empty { color: var(--muted); font-style: italic; }

  /* Topics timeline */
  .topic-entry {
    display: flex; gap: 10px; align-items: flex-start;
  }
  .topic-time {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); white-space: nowrap; padding-top: 2px;
  }
  .topic-label {
    background: var(--surface2); border-radius: 6px;
    padding: 4px 10px; font-size: 12px; flex: 1;
  }

  /* Speakers */
  .speaker-card {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); border-radius: var(--radius); padding: 8px 12px;
  }
  .speaker-name { font-weight: 600; font-size: 13px; }
  .rename-btn { font-size: 11px; color: var(--muted); cursor: pointer; }
  .rename-btn:hover { color: var(--accent); }

  /* Q&A */
  .qa-messages {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    min-height: 200px;
  }
  .qa-msg { padding: 10px 12px; border-radius: var(--radius); font-size: 13px; line-height: 1.6; }
  .qa-msg.user { background: var(--accent); color: #fff; align-self: flex-end; max-width: 85%; }
  .qa-msg.bot  { background: var(--surface2); align-self: flex-start; max-width: 95%; }
  .qa-input-row { display: flex; gap: 8px; margin-top: auto; }
  .qa-input { flex: 1; }

  /* Post-analysis */
  .analysis-box {
    background: var(--surface2); border-radius: var(--radius);
    padding: 12px; font-size: 12px; line-height: 1.7;
    white-space: pre-wrap; color: var(--text);
    max-height: 400px; overflow-y: auto;
  }

  /* Misc */
  .empty-state {
    text-align: center; color: var(--muted);
    padding: 40px 16px; font-size: 13px;
  }
  .label-sm { font-size: 11px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.6px; }
  .badge-live {
    font-size: 10px; font-weight: 700; background: var(--live);
    color: #fff; padding: 2px 6px; border-radius: 4px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Meeting<span>Mind</span></div>
  <div class="status-pill">
    <div class="dot" id="dot"></div>
    <span id="status-text">Idle</span>
  </div>
</header>

<div class="main-grid">
  <!-- Controls -->
  <div class="controls">
    <input type="text" id="speakers-input" placeholder="Known speakers (comma-separated): Aditya, Rohan, Priya" style="flex:1">
    <button class="btn-start" id="btn-start" onclick="startSession()">Start</button>
    <button class="btn-stop"  id="btn-stop"  onclick="stopSession()" disabled>Stop</button>
    <button class="btn-ghost" id="btn-analyse" onclick="runAnalysis()" disabled>Analyse</button>
  </div>

  <!-- Transcript -->
  <div class="transcript-panel" id="transcript-panel">
    <div class="empty-state" id="empty-transcript">
      Press <strong>Start</strong> to begin recording a session.
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="tabs">
      <div class="tab active" onclick="showTab('summary')">Summary</div>
      <div class="tab" onclick="showTab('topics')">Topics</div>
      <div class="tab" onclick="showTab('speakers')">Speakers</div>
      <div class="tab" onclick="showTab('qa')">Q&amp;A</div>
    </div>

    <!-- Summary -->
    <div class="tab-panel active" id="tab-summary">
      <div class="label-sm">Live summary <span class="badge-live">LIVE</span></div>
      <div class="summary-box empty" id="live-summary">Waiting for content...</div>
      <div class="label-sm" id="post-label" style="display:none">Post-session analysis</div>
      <div class="analysis-box" id="analysis-box" style="display:none"></div>
    </div>

    <!-- Topics -->
    <div class="tab-panel" id="tab-topics">
      <div class="label-sm">Topic timeline</div>
      <div id="topics-list">
        <div class="empty-state">No topics detected yet.</div>
      </div>
    </div>

    <!-- Speakers -->
    <div class="tab-panel" id="tab-speakers">
      <div class="label-sm">Participants</div>
      <div id="speakers-list">
        <div class="empty-state">No speakers detected yet.</div>
      </div>
    </div>

    <!-- Q&A -->
    <div class="tab-panel" id="tab-qa">
      <div class="qa-messages" id="qa-messages">
        <div class="empty-state">Ask anything about this meeting.</div>
      </div>
      <div class="qa-input-row">
        <input type="text" class="qa-input" id="qa-input"
          placeholder="e.g. What did Rohan say about budget?"
          onkeydown="if(event.key==='Enter') sendQuestion()">
        <button class="btn-action" onclick="sendQuestion()">Ask</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────
let ws = null;
let sessionId = null;
let speakerColorMap = {};
let speakerColorIdx = 0;
let lastSpeaker = null;
let isRecording = false;
const COLORS = ['spk-0','spk-1','spk-2','spk-3','spk-4','spk-5'];

// ── WebSocket ─────────────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleEvent(msg);
  };

  ws.onclose = () => {
    console.log('WS disconnected');
    setStatus('disconnected');
    setTimeout(connectWS, 2000);
  };
}

function handleEvent(msg) {
  switch(msg.event) {
    case 'snapshot':
      sessionId = msg.session_id;
      msg.transcript.forEach(addSegment);
      if (msg.live_summary) updateLiveSummary(msg.live_summary);
      msg.topics.forEach(t => addTopic(t.time, t.topic));
      msg.speakers.forEach(s => upsertSpeaker(s));
      break;
    case 'transcript':
      msg.segments.forEach(addSegment);
      break;
    case 'live_summary':
      updateLiveSummary(msg.summary);
      break;
    case 'topic':
      addTopic(msg.time, msg.topic);
      break;
  }
}

// ── Session controls ──────────────────────────────────────────────────────
async function startSession() {
  const raw = document.getElementById('speakers-input').value;
  const speakers = raw.split(',').map(s => s.trim()).filter(Boolean);

  const res = await fetch('/session/start', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ known_speakers: speakers })
  });
  const data = await res.json();
  sessionId = data.session_id;
  isRecording = true;

  document.getElementById('btn-start').disabled = true;
  document.getElementById('btn-stop').disabled  = false;
  document.getElementById('btn-analyse').disabled = true;
  document.getElementById('empty-transcript').style.display = 'none';
  setStatus('live');
}

async function stopSession() {
  await fetch('/session/stop', { method: 'POST' });
  isRecording = false;
  document.getElementById('btn-start').disabled  = false;
  document.getElementById('btn-stop').disabled   = true;
  document.getElementById('btn-analyse').disabled = false;
  setStatus('ready', 'Stopped');
}

async function runAnalysis() {
  if (!sessionId) return;
  document.getElementById('btn-analyse').disabled = true;
  document.getElementById('btn-analyse').textContent = 'Analysing...';

  const res  = await fetch(`/session/${sessionId}/analyse`, { method: 'POST' });
  const data = await res.json();

  document.getElementById('post-label').style.display = '';
  const box = document.getElementById('analysis-box');
  box.style.display = '';
  box.textContent = data.analysis;

  document.getElementById('btn-analyse').textContent = 'Analyse';
  showTab('summary');
}

// ── Transcript rendering ──────────────────────────────────────────────────
function speakerColor(name) {
  if (!speakerColorMap[name]) {
    speakerColorMap[name] = COLORS[speakerColorIdx % COLORS.length];
    speakerColorIdx++;
  }
  return speakerColorMap[name];
}

function fmtTime(secs) {
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function addSegment(seg) {
  const panel = document.getElementById('transcript-panel');
  const spk   = seg.speaker || 'Unknown';
  const color = speakerColor(spk);

  if (spk !== lastSpeaker) {
    const group = document.createElement('div');
    group.className = 'segment-group';
    group.innerHTML = `
      <div class="speaker-label ${color}">
        ${spk}
        <span class="ts">${fmtTime(seg.start)}</span>
      </div>
      <div class="segment-text new">${escHtml(seg.text)}</div>
    `;
    panel.appendChild(group);
    lastSpeaker = spk;
  } else {
    const last = panel.querySelector('.segment-group:last-child .segment-text');
    if (last) last.textContent += ' ' + seg.text;
  }

  upsertSpeaker(spk);
  panel.scrollTop = panel.scrollHeight;
}

// ── Summary ───────────────────────────────────────────────────────────────
function updateLiveSummary(text) {
  const el = document.getElementById('live-summary');
  el.textContent = text;
  el.classList.remove('empty');
}

// ── Topics ────────────────────────────────────────────────────────────────
function addTopic(time, topic) {
  const list = document.getElementById('topics-list');
  const empty = list.querySelector('.empty-state');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'topic-entry';
  div.innerHTML = `<div class="topic-time">${fmtTime(time)}</div>
                   <div class="topic-label">${escHtml(topic)}</div>`;
  list.appendChild(div);
}

// ── Speakers ──────────────────────────────────────────────────────────────
function upsertSpeaker(name) {
  const list  = document.getElementById('speakers-list');
  const empty = list.querySelector('.empty-state');
  if (empty) empty.remove();

  const existing = document.getElementById(`spk-card-${CSS.escape(name)}`);
  if (existing) return;

  const card = document.createElement('div');
  card.className = 'speaker-card';
  card.id = `spk-card-${name}`;
  const color = speakerColor(name);
  card.innerHTML = `
    <div class="speaker-name ${color}">${escHtml(name)}</div>
    <span class="rename-btn" onclick="promptRename('${escAttr(name)}')">rename</span>
  `;
  list.appendChild(card);
}

async function promptRename(currentLabel) {
  const newLabel = prompt(`Rename "${currentLabel}" to:`);
  if (!newLabel || !newLabel.trim() || !sessionId) return;

  await fetch(`/session/${sessionId}/rename`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ current_label: currentLabel, new_label: newLabel.trim() })
  });
  location.reload();   // simplest refresh — could do partial update
}

// ── Q&A ───────────────────────────────────────────────────────────────────
async function sendQuestion() {
  if (!sessionId) { alert('No active session.'); return; }
  const input = document.getElementById('qa-input');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';

  appendQAMsg(q, 'user');

  const res  = await fetch(`/session/${sessionId}/ask`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ question: q })
  });
  const data = await res.json();
  appendQAMsg(data.answer, 'bot');
}

function appendQAMsg(text, role) {
  const container = document.getElementById('qa-messages');
  const empty     = container.querySelector('.empty-state');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `qa-msg ${role}`;
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ── Tabs ──────────────────────────────────────────────────────────────────
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const names = ['summary','topics','speakers','qa'];
    t.classList.toggle('active', names[i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === `tab-${name}`);
  });
}

// ── Status ────────────────────────────────────────────────────────────────
function setStatus(state, label) {
  const dot  = document.getElementById('dot');
  const text = document.getElementById('status-text');
  dot.className = 'dot ' + state;
  text.textContent = label || (state === 'live' ? 'Recording' : state === 'ready' ? 'Ready' : 'Idle');
}

// ── Utils ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'");
}

// ── Init ──────────────────────────────────────────────────────────────────
connectWS();
</script>
</body>
</html>
